<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aethel OS - Futuristic Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud-header">
        <h1>AETHEL OS v1.0</h1>
        <div id="live-clock">00:00:00</div>
    </div>

    <div class="main-container">
        <!-- Calculator Widget -->
        <div class="widget">
            <h3>Calculator</h3>
            <input type="text" id="calc-display" readonly value="0">
            <div class="calc-grid">
                <button onclick="clearCalc()">C</button>
                <button onclick="appendCalc('/')">/</button>
                <button onclick="appendCalc('*')">*</button>
                <button onclick="appendCalc('-')">-</button>
                <button onclick="appendCalc('7')">7</button>
                <button onclick="appendCalc('8')">8</button>
                <button onclick="appendCalc('9')">9</button>
                <button onclick="appendCalc('+')">+</button>
                <button onclick="appendCalc('4')">4</button>
                <button onclick="appendCalc('5')">5</button>
                <button onclick="appendCalc('6')">6</button>
                <button onclick="calculateResult()" class="span-two">=</button>
                <button onclick="appendCalc('1')">1</button>
                <button onclick="appendCalc('2')">2</button>
                <button onclick="appendCalc('3')">3</button>
                <button onclick="appendCalc('0')">0</button>
            </div>
        </div>

        <!-- Notes Widget -->
        <div class="widget">
            <h3>Quick Notes</h3>
            <textarea id="notes-area" placeholder="Type notes here..."></textarea>
            <button onclick="saveNotes()">Save Notes</button>
            <span id="save-status"></span>
        </div>
    </div>

    <!-- Floating Dock -->
    <div class="floating-dock">
        <div class="dock-icon" title="Dashboard">🌌</div>
        <div class="dock-icon" title="Calculator">🧮</div>
        <div class="dock-icon" title="Notes">📝</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
